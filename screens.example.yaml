screens:
  - id: clock
    name: Clock
    type: builtin
    source: clock
    config: { face: minimal, show_seconds: false }
    preload: true

  - id: photos
    name: Family photos
    type: builtin
    source: photos
    config:
      library: google
      google_album_id: "replace-with-google-photos-album-id"
      google_client_id: "replace-with-google-oauth-client-id"
      google_client_secret_file: /etc/frame/secrets/google_photos_client_secret
      google_refresh_token_file: /etc/frame/secrets/google_photos_refresh_token
      interval_sec: 30
      transition_style: kenburns
    preload: true

  - id: grafana-home
    name: Home dashboard
    type: url
    source: https://grafana.local/d/abc/home?kiosk
    preload: true
    reloadIntervalSec: 60

  - id: now-playing
    name: Now playing
    type: builtin
    source: now-playing
    preload: true
